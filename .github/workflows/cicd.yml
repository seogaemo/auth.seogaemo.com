name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    env:
      # Seogaemo 계정에서 만든 토큰 (권한: README "배포" 참고)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 토큰이 여러 계정에 걸려 있어도 Seogaemo 계정을 쓰게 고정한다
      CLOUDFLARE_ACCOUNT_ID: 1b8407512618dbd73ee7e9f657246591

    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SDK(packages/*)가 깨졌으면 서버를 배포하기 전에 멈춘다.
      # oauth-browser, oauth-next는 빌드된 @seogaemo/oauth를 읽으니 먼저 빌드한다 (pnpm -r은 의존 순서대로 돈다)
      - name: Test SDK packages
        run: |
          pnpm -r --filter "./packages/**" build
          pnpm -r --filter "./packages/**" typecheck
          pnpm -r --filter "./packages/**" --if-present run test

      - name: Check login providers
        working-directory: apps/auth
        run: pnpm run check:providers

      - name: Apply D1 migrations
        working-directory: apps/auth
        run: pnpm run db:migrate:remote

      # opennextjs-cloudflare build로 .open-next를 만든 뒤 wrangler deploy까지 한다.
      # 이 키가 없으면 Next가 빌드마다 Server Action ID를 새로 만들어서, 배포 전에 열어 둔 탭의 저장 버튼이
      # "Server Action was not found"로 깨진다. 키를 고정하면 액션 코드가 바뀌지 않는 한 ID가 유지된다.
      - name: Build and deploy
        working-directory: apps/auth
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: pnpm run deploy
