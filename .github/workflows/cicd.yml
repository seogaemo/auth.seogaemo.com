name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    env:
      # Seogaemo 계정에서 만든 토큰 (권한: README "배포" 참고)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 토큰이 여러 계정에 걸려 있어도 Seogaemo 계정을 쓰게 고정한다
      CLOUDFLARE_ACCOUNT_ID: 1b8407512618dbd73ee7e9f657246591

    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SDK(packages/*)가 깨졌으면 서버를 배포하기 전에 멈춘다
      - name: Test SDK packages
        run: |
          pnpm -r --filter "./packages/**" typecheck
          pnpm -r --filter "./packages/**" --if-present run test
          pnpm -r --filter "./packages/**" build

      - name: Check login providers
        working-directory: apps/auth
        run: pnpm run check:providers

      - name: Apply D1 migrations
        working-directory: apps/auth
        run: pnpm run db:migrate:remote

      # opennextjs-cloudflare build로 .open-next를 만든 뒤 wrangler deploy까지 한다.
      - name: Build and deploy
        working-directory: apps/auth
        run: pnpm run deploy
